name: link2vault

x-application-service: &application-service
  build:
    context: ../..
    dockerfile: apps/api/Dockerfile
  image: link2vault-api:phase1
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:uid=10001,gid=10001,mode=1770
  networks:
    - internal
  volumes:
    - app-data:/var/lib/link2vault/app
    - vault-data:/var/lib/link2vault/vault
    - media-tmp:/var/lib/link2vault/media-tmp

services:
  api:
    <<: *application-service
    command:
      - uvicorn
      - link2vault.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    environment:
      LINK2VAULT_APP_ENV: "${LINK2VAULT_APP_ENV:-production}"
      LINK2VAULT_DATA_DIR: "/var/lib/link2vault/app"
      LINK2VAULT_MEDIA_TMP_DIR: "/var/lib/link2vault/media-tmp"
      LINK2VAULT_VAULT_ROOT: "/var/lib/link2vault/vault"
      LINK2VAULT_MAX_UPLOAD_MB: "${LINK2VAULT_MAX_UPLOAD_MB:-1024}"
      LINK2VAULT_MAX_AUDIO_MINUTES: "${LINK2VAULT_MAX_AUDIO_MINUTES:-240}"
      LINK2VAULT_MONTHLY_AUDIO_MINUTES: "${LINK2VAULT_MONTHLY_AUDIO_MINUTES:-600}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz'));
          assert set(data) == {'status', 'version'} and data['status'] == 'ok'
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    <<: *application-service
    command:
      - python
      - /opt/link2vault/bin/link2vault-worker
    environment:
      LINK2VAULT_APP_ENV: "${LINK2VAULT_APP_ENV:-production}"
      LINK2VAULT_DATA_DIR: "/var/lib/link2vault/app"
      LINK2VAULT_MEDIA_TMP_DIR: "/var/lib/link2vault/media-tmp"
      LINK2VAULT_VAULT_ROOT: "/var/lib/link2vault/vault"
      LINK2VAULT_MAX_UPLOAD_MB: "${LINK2VAULT_MAX_UPLOAD_MB:-1024}"
      LINK2VAULT_MAX_AUDIO_MINUTES: "${LINK2VAULT_MAX_AUDIO_MINUTES:-240}"
      LINK2VAULT_MONTHLY_AUDIO_MINUTES: "${LINK2VAULT_MONTHLY_AUDIO_MINUTES:-600}"
      LINK2VAULT_ASR_PROVIDER: "${LINK2VAULT_ASR_PROVIDER:-fake}"
      LINK2VAULT_TENCENT_SECRET_ID: "${LINK2VAULT_TENCENT_SECRET_ID:-}"
      LINK2VAULT_TENCENT_SECRET_KEY: "${LINK2VAULT_TENCENT_SECRET_KEY:-}"
      LINK2VAULT_TENCENT_REGION: "${LINK2VAULT_TENCENT_REGION:-ap-guangzhou}"
      LINK2VAULT_TENCENT_COS_BUCKET: "${LINK2VAULT_TENCENT_COS_BUCKET:-}"
      LINK2VAULT_TENCENT_ASR_SAFETY_SECONDS: "${LINK2VAULT_TENCENT_ASR_SAFETY_SECONDS:-300}"
      LINK2VAULT_CLEANER_PROVIDER: "${LINK2VAULT_CLEANER_PROVIDER:-fake}"
      LINK2VAULT_DEEPSEEK_BASE_URL: "${LINK2VAULT_DEEPSEEK_BASE_URL:-}"
      LINK2VAULT_DEEPSEEK_API_KEY: "${LINK2VAULT_DEEPSEEK_API_KEY:-}"
      LINK2VAULT_DEEPSEEK_MODEL: "${LINK2VAULT_DEEPSEEK_MODEL:-deepseek-chat}"
      LINK2VAULT_BARK_BASE_URL: "${LINK2VAULT_BARK_BASE_URL:-}"
      LINK2VAULT_BARK_DEVICE_KEY: "${LINK2VAULT_BARK_DEVICE_KEY:-}"
    networks:
      - internal
      - outbound

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
    # Copying strips the packaged bind-service file capability so UID 10001 can
    # execute Caddy without violating no-new-privileges.
    command:
      - >-
        cp /usr/bin/caddy /tmp/caddy
        && exec /tmp/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      LINK2VAULT_ADMIN_USER: "${LINK2VAULT_ADMIN_USER:-example-admin}"
      LINK2VAULT_ADMIN_PASSWORD_HASH: "${LINK2VAULT_ADMIN_PASSWORD_HASH:-$$2a$$14$$EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE}"
      LINK2VAULT_MAX_UPLOAD_MB: "${LINK2VAULT_MAX_UPLOAD_MB:-1024}"
    ports:
      - "127.0.0.1:${LINK2VAULT_HTTP_PORT:-8080}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /config:uid=10001,gid=10001,mode=0700
      - /data:uid=10001,gid=10001,mode=0700
      - /tmp:rw,exec,uid=10001,gid=10001,mode=1770
    user: "10001:10001"
    networks:
      - edge
      - internal
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro

networks:
  edge:
    internal: false
  internal:
    internal: true
  outbound:
    internal: false

volumes:
  app-data:
  vault-data:
  media-tmp:
