[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "link2vault"
version = "0.1.0"
description = "Link2Vault public service foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "cos-python-sdk-v5>=1.9.44,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20,<1",
    "tencentcloud-sdk-python-asr>=3.1.112,<4",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pyyaml>=6,<7",
    "ruff>=0.8,<1",
    "starlette[full]>=1.3,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/link2vault", "packages/providers/link2vault_providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
