[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "link2vault"
version = "0.1.0"
description = "Link2Vault public service foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic-settings>=2.8,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/link2vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
